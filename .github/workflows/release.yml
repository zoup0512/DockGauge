name: Release

# 推送 v* 标签时自动打包并发布 Release；也可在 Actions 页手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-manual" >> "$GITHUB_ENV"
          fi

      - name: Publish (framework-dependent, single file)
        run: >
          dotnet publish src/DockGauge/DockGauge.csproj
          -c Release -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:Version=${{ env.VERSION }}
          -o publish

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path publish/DockGauge.exe -DestinationPath "DockGauge-v${{ env.VERSION }}-win-x64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: DockGauge-*.zip
          generate_release_notes: true
